name: Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'hooks/**'
      - 'lib/**'
      - 'utils/**'
      - '__tests__/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'jest.config*.js'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'hooks/**'
      - 'lib/**'
      - 'utils/**'
      - '__tests__/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'jest.config*.js'

jobs:
  test:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run component tests
        run: npm run test:components
